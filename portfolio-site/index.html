    <!-- GitHub Pages SPA routing: restore URL encoded by 404.html -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var decoded = decodeURIComponent(p);
          // Split off any hash
          var hashIdx = decoded.indexOf('#');
          var path = hashIdx === -1 ? decoded : decoded.slice(0, hashIdx);
          var hash = hashIdx === -1 ? '' : decoded.slice(hashIdx);
          // Split off any query string
          var queryIdx = path.indexOf('?');
          var query = queryIdx === -1 ? '' : path.slice(queryIdx);
          path = queryIdx === -1 ? path : path.slice(0, queryIdx);
          var newUrl = '/' + path + query + hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>
